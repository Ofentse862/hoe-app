<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080809">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HOE">
<meta name="description" content="HOE — Heaven On Earth. Focus on what matters, privately.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./styles.css">
<title>HOE — Heaven On Earth</title>
</head>
<body>
<div class="app" id="app">
  <header id="header" class="header"></header>
  <main id="view" class="view" tabindex="-1"><p class="subtle">Opening your private space…</p></main>
  <nav id="nav" class="nav" aria-label="Primary navigation"></nav>
  <div id="layer"></div>
  <div id="toast" class="toast" aria-live="polite" role="status"></div>
  <input id="photo-input" type="file" accept="image/*" capture="user" hidden>
  <input id="backup-input" type="file" accept="application/json,.json" hidden>
  <input id="note-photo-input" type="file" accept="image/*" hidden>
</div>
<script defer src="./app.js"></script>
</body>
</html>
