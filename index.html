<!doctype html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080809">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HOE">
  <meta name="description" content="HOE — Heaven On Earth. A personal operating system for life and money.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <title>HOE — Heaven On Earth</title>
</head>
<body>
  <div class="app-shell" id="app">
    <header id="topbar" class="topbar"></header>
    <main id="content" class="content" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main navigation"></nav>
    <div id="modal-root" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="restore-file" type="file" accept="application/json,.json" hidden>
    <input id="media-picker" type="file" accept="image/*,video/*" capture="environment" hidden>
  </div>
  <script src="./app.js" defer></script>
</body>
</html>
