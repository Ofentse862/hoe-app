<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HOE">
<meta name="description" content="HOE — Heaven On Earth. A private, offline-first personal operating system.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./styles.css">
<title>HOE — Heaven On Earth</title>
</head>
<body>
<div id="app" class="app-shell">
<header id="topbar" class="topbar"></header>
<main id="content" class="content" tabindex="-1"><p class="muted">Opening your private space…</p></main>
<nav id="tabbar" class="tabbar" aria-label="Main navigation"></nav>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<input type="file" id="photo-file" accept="image/*" capture="environment" hidden>
<input type="file" id="receipt-file" accept="image/*" capture="environment" hidden>
</div>
<script src="./app.js" defer></script>
</body>
</html>
